name: Insomnia API Tests (CI/CD)

on:
  push:
    branches: [ main, develop, dev, testIsomnia ]
    paths:
      - 'server/**'
      - '.github/workflows/inso-api-tests.yml'
  pull_request:
    branches: [ main, develop, dev, testIsomnia ]
    paths:
      - 'server/**'

jobs:
  inso-tests:
    name: Run Insomnia API Tests
    runs-on: ubuntu-latest

    services:
      # Cấu hình MongoDB service container chạy ngầm phục vụ kiểm thử
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      # 1. Checkout mã nguồn dự án
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cấu hình Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # 3. Cài đặt các dependencies cho backend
      - name: Install Dependencies
        run: |
          cd server
          npm ci

      # 4. Tạo file .env.test chứa các credentials giả lập cho môi trường CI
      - name: Create Env Configuration
        run: |
          cat <<EOF > server/.env.test
          NODE_ENV=test
          PORT=5000
          MONGODB_URI=mongodb://localhost:27017/smart_english_test
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=ci_test_access_secret_key_extremely_long_and_secure
          JWT_REFRESH_SECRET=ci_test_refresh_secret_key_extremely_long_and_secure
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY=7d
          CLIENT_URL=http://localhost:5173
          SERVER_URL=http://localhost:5000
          EOF

      # 5. Khởi chạy Server Backend dưới nền (Background process)
      - name: Start Backend Server
        env:
          NODE_ENV: test
        run: |
          cd server
          # Chạy server ở chế độ background
          npm start &
          
          # Đợi cho server khởi động và trả về 200 OK ở route health check
          npx wait-on http://localhost:5000/api/health --timeout 30000
          echo "🚀 Backend server is up and running!"

      # 6. Cài đặt Inso CLI để thực thi các test suite
      - name: Setup Inso CLI
        uses: kong/setup-inso@v2
        with:
          inso-version: 10.3.1

      # 7. Thực thi kiểm thử tự động với Inso CLI
      # Sử dụng run collection để thực thi toàn bộ request và các mã test (After-response) trong Collection
      - name: Run Insomnia Tests
        run: |
          inso run collection "BaiThucHanhAutoTest" -w server/tests/insomnia-spec.yaml
