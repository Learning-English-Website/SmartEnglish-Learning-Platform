collection:
  - url: "{{base_url}}/auth/login"
    name: Login
    meta:
      id: req_ed8060b551f44b79a87b5ef6f69078ed
      created: 1781775283593
      modified: 1781783487899
      isPrivate: false
      description: ""
      sortKey: -1781775283593
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "email": "admin@gmail.com",
          "password": "Memoris123"
        }
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      afterResponse: |-
        insomnia.test("Kiểm tra API Đăng nhập thành công", function () {
            // 1. Kiểm tra Status Code phải là 200
            insomnia.expect(insomnia.response.code).to.eql(200);

            // 2. Chuyển đổi dữ liệu trả về thành JSON
            const body = insomnia.response.json();

            // 3. Kiểm tra cấu trúc ApiResponse
            insomnia.expect(body.success).to.be.true;
            insomnia.expect(body.message).to.eql('Đăng nhập thành công');

            // 4. Đảm bảo có token trả về
            insomnia.expect(body.data).to.have.property('accessToken');
            insomnia.expect(body.data.user).to.have.property('email');
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{base_url}}/users/profile"
    name: getProfile
    meta:
      id: req_e26ed04657f6495cb2010ee3ab8ae666
      created: 1781775889160
      modified: 1781782615216
      isPrivate: false
      description: ""
      sortKey: -1781775889160
    method: GET
    headers:
      - name: Authorization
        value: Bearer {% response 'body', 'req_ed8060b551f44b79a87b5ef6f69078ed',
          'b64::JC5kYXRhLmFjY2Vzc1Rva2Vu::46b', 'always', 60 %}
        description: ""
        disabled: false
    scripts:
      afterResponse: |-
        insomnia.test("Kiểm tra lấy thông tin Profile hợp lệ", function () {
            // 1. Kiểm tra trạng thái HTTP là 200
            insomnia.expect(insomnia.response.code).to.eql(200);

            const body = insomnia.response.json();

            // 2. Xác thực cấu trúc dữ liệu người dùng
            insomnia.expect(body.success).to.be.true;
            insomnia.expect(body.data).to.have.property('_id');
            insomnia.expect(body.data).to.have.property('role');

            // 3. Đảm bảo bảo mật (không được trả về password)
            insomnia.expect(body.data).to.not.have.property('password'); 
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ base_url }}/flashcard-sets/my"
    name: getMySets
    meta:
      id: req_70404c9f4dec42d38c66f01b41e604a0
      created: 1781782428310
      modified: 1781782641324
      isPrivate: false
      description: ""
      sortKey: -1781782428310
    method: GET
    headers:
      - name: Authorization
        value: Bearer {% response 'body', 'req_ed8060b551f44b79a87b5ef6f69078ed',
          'b64::JC5kYXRhLmFjY2Vzc1Rva2Vu::46b', 'always', 60 %}
        description: ""
        disabled: false
    scripts:
      afterResponse: >
        insomnia.test("Kiểm tra lấy danh sách bộ thẻ học của tôi thành công",
        function () {
            // 1. Kiểm tra trạng thái HTTP phản hồi phải là 200 OK
            insomnia.expect(insomnia.response.code).to.eql(200);

            const body = insomnia.response.json();

            // 2. Xác thực cấu trúc phản hồi API chuẩn
            insomnia.expect(body.success).to.be.true;
            insomnia.expect(body.message).to.eql('Sets fetched');

            // 3. Xác thực dữ liệu 'data' trả về phải là một danh sách (Mảng/Array)
            insomnia.expect(body.data).to.be.an('array');
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ base_url }}/gamification/stats"
    name: getGamificationStats
    meta:
      id: req_9d81ba12478c48798919fa0681f99eca
      created: 1781782951819
      modified: 1781783554823
      isPrivate: false
      description: ""
      sortKey: -1781782951819
    method: GET
    headers:
      - name: Authorization
        value: Bearer {% response 'body', 'req_ed8060b551f44b79a87b5ef6f69078ed',
          'b64::JC5kYXRhLmFjY2Vzc1Rva2Vu::46b', 'always', 60 %}
        description: ""
        disabled: false
    scripts:
      afterResponse: >
        insomnia.test("Kiểm tra lấy thống kê Gamification thành công", function
        () {
            // 1. Kiểm tra trạng thái HTTP là 200 OK
            insomnia.expect(insomnia.response.code).to.eql(200);

            const body = insomnia.response.json();

            // 2. Xác thực cấu trúc phản hồi
            insomnia.expect(body.success).to.be.true;
            insomnia.expect(body.message).to.eql('Gamification stats fetched');

            // 3. Đảm bảo có chứa thông tin streak và thông tin gamification
            insomnia.expect(body.data).to.have.property('streak');
            insomnia.expect(body.data).to.have.property('gamification');

            // 4. Kiểm tra xem có level và xp của người dùng hay không
            insomnia.expect(body.data.gamification).to.have.property('level');
            insomnia.expect(body.data.gamification).to.have.property('xp');
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
